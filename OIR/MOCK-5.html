<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="description" content="OIR Mock Test 5 - Officers Intelligence Rating Test Simulation by Col Vyas (Retd.)">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>OIR Mock Test 5 - DOSPDP SSB Preparation</title>
  
  <!-- Slab Serif Typography: Roboto Slab -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/oir.css">
  <link rel="icon" type="image/png" href="../assets/images/logo.png">
</head>
<body class="mock-viewer-page">

  <!-- Top Navigation Bar -->
  <header class="mock-topbar">
    <div class="mock-topbar-left">
      <a href="../OIR.html" class="mock-back-link" title="Return to OIR Mock Series">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span>OIR Hub</span>
      </a>
      
      <div class="mock-title-group">
        <span class="mock-title-badge">MOCK 5</span>
        <h1 class="mock-page-heading">OIR Practice Test 05</h1>
      </div>
    </div>

    <div class="mock-topbar-right">
      <a href="../PDF/OIR-NEW/OIR-5-Sol.pdf" target="_blank" class="mock-header-btn mock-header-sol-btn" title="View Solution PDF">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
        </svg>
        <span>Solutions</span>
      </a>
    </div>
  </header>

  <!-- Main Adobe Acrobat PDF Embed Viewport -->
  <main class="mock-pdf-viewport" id="mockPdfViewport">
    <noscript>
      Please enable scripts/disable adblocker to view content or download the pdf to attempt OIR. Scripts would allow viewing adobe pdf file.
    </noscript>
    <div id="adobe-dc-view"></div>
  </main>

  <!-- Floating Timer Widget (Bottom-Left: 30 Minutes) -->
  <aside class="oir-timer-widget" id="oirTimerWidget" data-timer-minutes="30" aria-label="Mock Test Countdown Timer">
    <div class="oir-timer-header">
      <div class="timer-header-info">
        <span class="timer-live-dot" id="timerPulseDot"></span>
        <span class="timer-title-text">Timer</span>
      </div>
      <button class="timer-toggle-size-btn" id="timerCollapseBtn" type="button" title="Minimize / Expand Timer" aria-label="Minimize or expand timer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="4 14 10 14 10 20"></polyline>
          <polyline points="20 10 14 10 14 4"></polyline>
        </svg>
      </button>
    </div>

    <!-- Digits Countdown Display -->
    <div class="oir-timer-digits" id="timerDigits" aria-live="off">30:00</div>

    <!-- Start / Pause / Reset Controls -->
    <div class="oir-timer-controls">
      <button class="timer-btn timer-btn-primary" id="timerToggleBtn" type="button">
        <svg class="icon-play" viewBox="0 0 24 24" width="12" height="12" fill="currentColor">
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
        <svg class="icon-pause" style="display: none;" viewBox="0 0 24 24" width="12" height="12" fill="currentColor">
          <rect x="6" y="4" width="4" height="16"></rect>
          <rect x="14" y="4" width="4" height="16"></rect>
        </svg>
        <span id="timerToggleLabel">Start</span>
      </button>

      <button class="timer-btn timer-btn-secondary" id="timerResetBtn" type="button" title="Reset Timer">
        <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
          <path d="M3 3v5h5"></path>
        </svg>
        <span>Reset</span>
      </button>
    </div>
  </aside>

  <!-- Floating Download FAB (Bottom-Right) -->
  <a href="../PDF/OIR-NEW/OIR-5.pdf" download="OIR-5.pdf" class="oir-download-fab" id="oirDownloadFab" title="Download Question PDF" aria-label="Download Question PDF">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
      <polyline points="7 10 12 15 17 10"></polyline>
      <line x1="12" y1="15" x2="12" y2="3"></line>
    </svg>
    <span class="fab-tooltip">Download PDF</span>
  </a>

  <!-- Adobe Acrobat Embed SDK Script -->
  <script src="https://documentcloud.adobe.com/view-sdk/main.js"></script>
  <script type="text/javascript">
    document.addEventListener("adobe_dc_view_sdk.ready", function(){
      var adobeDCView = new AdobeDC.View({clientId: "a99cb668cd60497eb40841b429540749", divId: "adobe-dc-view"});
      adobeDCView.previewFile({
        content:{location: {url: "https://ssb.colonelvyas.org/PDF/OIR-NEW/OIR-5.pdf"}},
        metaData:{fileName: "OIR MOCK TEST-5"}
      }, {defaultViewMode: "FIT_PAGE", showAnnotationTools: false, showLeftHandPanel: false,
      dockPageControls: false});
    });
    window.addEventListener('load', function() {
      var preloader = document.getElementById('js-preloader');
      if (preloader) preloader.classList.add('loaded');
    });
  </script>
  <!-- Timer Controller Script -->
  <script src="../assets/js/oir-test.js"></script>
</body>
</html>
