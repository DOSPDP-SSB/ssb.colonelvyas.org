<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 70" width="220" height="70" fill="none">
  <!-- Brand Title DOSPDP -->
  <g id="brand-logo">
    <!-- Letter D -->
    <text x="6" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="900" fill="#0f172a">D</text>
    
    <!-- Academic Mortarboard Cap on O -->
    <path d="M 38 12 L 49 7 L 60 12 L 49 17 Z" fill="#312e81" />
    <path d="M 42 14 L 42 19 C 42 22, 56 22, 56 19 L 56 14" fill="#1e1b4b" />
    <!-- Tassel -->
    <path d="M 49 12 L 60 16 L 60 23" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round" fill="none" />
    <circle cx="60" cy="23.5" r="1.6" fill="#f59e0b" />
    
    <!-- Letter O -->
    <text x="33" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="900" fill="#0f172a">O</text>
    
    <!-- Letter S -->
    <text x="63" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="900" fill="#0f172a">S</text>

    <!-- Outlined Box around PDP -->
    <rect x="92" y="8" width="82" height="32" rx="4" fill="none" stroke="#0f172a" stroke-width="2.5" />
    
    <!-- PDP Text -->
    <text x="100" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="900" letter-spacing="1.5" fill="#0f172a">PDP</text>
    
    <!-- Subtitle: By Col Vyas (Retd.) -->
    <text x="8" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="0.2" fill="#334155">By Col Vyas (Retd.)</text>
  </g>
</svg>